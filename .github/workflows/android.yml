name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (CPython)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      # Mortal (native/mortal) as a native library for the Mortal tests.
      - name: Mortal (native) and weights
        run: scripts/mortal/ci_setup.sh native
      # pyriichi is vendored as a zip; Python imports straight from it.
      - name: Run tests
        env:
          PYTHONPATH: public/py/pyriichi.zip
          MORTAL_LIB: native/mortal/target/release/libriichinight_mortal.so
          MORTAL_DIR: public/mortal
        run: python -m pytest tests/python -q

  build:
    name: Web build + Pyodide smoke test + APK
    needs: engine-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: deps
        name: Install dependencies
        run: |
          set -o pipefail
          # Exact versions from package-lock.json (reproducible builds); the
          # lock file is produced by the "Refresh package-lock.json" workflow.
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          else
            npm install --no-audit --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          fi

      # The Mortal heroines: WebAssembly module + weights into public/mortal.
      - id: mortal
        name: Mortal (WebAssembly) and weights
        run: |
          set -o pipefail
          scripts/mortal/ci_setup.sh wasm 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - id: smoke
        name: Engine inside Pyodide (full hanchan)
        run: |
          set -o pipefail
          npm run test:pyodide 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - id: web
        name: Type-check and build web app
        run: |
          set -o pipefail
          # Stylesheets must work on Android WebView 105+ (emulators, older
          # phones): newer CSS needs a fallback (scripts/check-css-compat.mjs).
          node scripts/check-css-compat.mjs 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      # Browser tests on the built app: rigged deals (?scenario=), seeded games,
      # layout screenshots in portrait / landscape and both table styles.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - id: e2e
        name: Browser tests (Playwright)
        run: |
          set -o pipefail
          pip install pytest playwright 2>&1 | tail -1
          python -m playwright install --with-deps chromium > /dev/null
          E2E_REQUIRE=1 E2E_DIST=dist python -m pytest tests/e2e -q 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/e2e/*.png
          if-no-files-found: ignore

      # The web version (for iPhones): the same build on GitHub Pages, from main.
      - name: Upload web version for GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK ships with GitHub's Ubuntu runners; just accept its licenses.
      - id: sdk
        name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - id: cap
        name: Add Android platform (first run) and sync
        run: |
          set -o pipefail
          { if [ ! -d android ]; then npx cap add android; fi; npx cap sync android; } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          # App icon (adaptive + round) and splash screens from scripts/make-icons.py.
          cp -r resources/android/res/. android/app/src/main/res/
          # Full-screen (immersive) activity: hides the status and navigation bars;
          # and the game's own vibration plugin (VibrationPlugin).
          cp resources/android/java/*.java \
            android/app/src/main/java/com/bogdanpetrenko/riichinightfx/

      - id: gradle
        name: Build debug APK
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # services.gradle.org sometimes times out: fetch the Gradle the
          # wrapper wants ourselves (retries, then Gradle's own mirror on
          # GitHub) and point the wrapper at the local file.
          props=gradle/wrapper/gradle-wrapper.properties
          dist=$(sed -n 's/^distributionUrl=.*\/\(gradle-[^/]*\.zip\)$/\1/p' "$props")
          ver=$(echo "$dist" | sed 's/^gradle-\(.*\)-\(all\|bin\)\.zip$/\1/')
          zip="$RUNNER_TEMP/$dist"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 -o "$zip" "https://services.gradle.org/distributions/$dist" \
            || curl -fsSL --retry 3 --retry-all-errors -o "$zip" "https://github.com/gradle/gradle-distributions/releases/download/v$ver/$dist" \
            || { api="https://api.github.com/repos/gradle/gradle-distributions/releases"
                 id=$(curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" "$api/tags/v$ver" \
                   | jq -r --arg n "$dist" '.assets[] | select(.name == $n) | .id')
                 curl -fsSL --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
                   -H "Accept: application/octet-stream" -o "$zip" "$api/assets/$id"; }
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\://$zip|" "$props"
          grep distributionUrl "$props"
          # Fixed debug key (signing/debug.keystore, the standard public
          # android/android debug credentials) so every CI build has the same
          # signature and installs over the previous one without uninstalling.
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      # Raw logs are not always reachable; this puts the step outcomes and the
      # end of the log into an annotation on the run page.
      - name: Report failure
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          outcomes=$(echo "$STEPS" | jq -r 'to_entries[] | "\(.key)=\(.value.outcome)"' | tr '\n' ' ')
          tail_log=""
          if [ -f "$RUNNER_TEMP/ci.log" ]; then
            tail_log=$(grep -v '^\s*$' "$RUNNER_TEMP/ci.log" | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          fi
          echo "::error title=CI failure::steps: ${outcomes}%0A${tail_log}"

      # Optional signed release: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$PWD/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Name APK files
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/RiichiNightFX-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist-apk/RiichiNightFX.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riichi-night-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      # A version tag (v0.2.0) gets a fixed release with the APK: either a
      # pushed tag (the release is created) or a release published on GitHub
      # (the APK is attached to it). Notes come from docs/releases/<tag>.md when
      # it exists. The tag must match package.json's version (Settings -> About).
      - name: Publish tagged release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'release' && startsWith(github.ref_name, 'v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"; exit 1
          fi
          apk="dist-apk/RiichiNightFX-$tag.apk"
          cp dist-apk/RiichiNightFX-debug.apk "$apk"
          notes="docs/releases/$tag.md"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber -R "$GITHUB_REPOSITORY"
            # A release published with an empty title gets the commit message
            # as its name: give it the version name instead.
            gh release edit "$tag" --title "Riichi Night FX $version" -R "$GITHUB_REPOSITORY"
            if [ -f "$notes" ]; then gh release edit "$tag" --notes-file "$notes" -R "$GITHUB_REPOSITORY"; fi
          else
            [ -f "$notes" ] || { echo "Riichi Night FX $version." > /tmp/notes.md; notes=/tmp/notes.md; }
            gh release create "$tag" "$apk" -R "$GITHUB_REPOSITORY" \
              --verify-tag --latest --title "Riichi Night FX $version" --notes-file "$notes"
          fi

      # Rolling pre-release with the latest debug APK from main, so it can be
      # fetched with `gh release download dev-latest` (artifacts need a login
      # to Azure blob storage that some environments cannot reach).
      - name: Publish dev-latest pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create dev-latest dist-apk/RiichiNightFX-debug.apk -R "$GITHUB_REPOSITORY" \
            --prerelease --target "$GITHUB_SHA" --title "Dev build (latest main)" \
            --notes "Debug APK from ${GITHUB_SHA::7}. Replaced on every push to main."

  # Publishes the web build to https://bogdanpetrenko13.github.io/RiichiNight-FX/.
  # Needs Settings -> Pages -> Source: "GitHub Actions" (set once by hand);
  # until then this job fails without failing the run.
  pages:
    name: Web version (GitHub Pages)
    needs: build
    # Also when only the APK failed: the web build is uploaded right after the
    # browser tests pass, and only then.
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
